<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Каталог настільних ігор</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <header>
            <h1>Каталог настільних ігор</h1>
            <nav>
                <a href="#filters">Фільтри</a>
                <a href="#games">Ігри</a>
            </nav>
        </header>

        <main>
            <section id="filters">
                <h2>Фільтри</h2>
                <form action="#", id="filter-form">
                    <label for="search-input">Пошук за назвою</label>
                    <input type="text" id="search-input" name="search" placeholder="Наприклад, Брас...">

                    <label for="player-filter">Кількість гравців:</label>
                    <select id="player-filter">
                        <option value="all">Будь-яка кількість</option>
                        <option value="2">2 гравців</option>
                        <option value="3">3 гравців</option>
                        <option value="4">4 гравців</option>
                        <option value="5">5 гравців</option>
                    </select>

                    <label for="genre-filter">Жанр:</label>
                    <select id="genre-filter">
                        <option value="all">Всі жанри</option>
                        <option value="strategy">Стратегії</option>
                        <option value="euro">Євро</option>
                        <option value="cards">Карткові ігри</option>
                        <option value="cooperat">Кооперативні ігри</option>
                        <option value="party">Партійні ігри</option>
                    </select>
                </form>
            </section>

            <section id="add-game">
                <h2>Додати гру</h2>
                <form id="add-game-form">
                    <label for="game-title">Назва гри:</label>
                    <input type="text" id="game-title" required>

                    <label for="game-min">Мін. гравців:</label>
                    <input type="number" id="game-min" required min="1">

                    <label for="game-max">Макс. гравців:</label>
                    <input type="number" id="game-max" required min="1">

                    <label for="game-genre">Жанр:</label>
                    <select id="game-genre">
                        <option value="strategy">Стратегії</option>
                        <option value="euro">Євро</option>
                        <option value="cards">Карткові ігри</option>
                        <option value="cooperat">Кооперативні ігри</option>
                        <option value="party">Партійні ігри</option>
                    </select>

                    <button type="submit" class="filter-btn">Додати</button>
                    <p id="form-error" style="color: #e74c3c; font-weight: bold; margin-top: 10px;"></p>
                </form>
            </section>

            <section id="games-list">
                <h2>Ігри</h2>
                <p id="games-count"></p>
                
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Каталог настільних ігор. Розробниця: Sofiia.</p>
        </footer>
        <script src="js/app.js"></script>
    </body>
</html>
